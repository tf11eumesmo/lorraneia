<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lorrane IA — Chat com IAs</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f; --surface: #12121a; --surface2: #1a1a26;
    --border: rgba(255,255,255,0.08); --border-hover: rgba(255,255,255,0.15);
    --text: #f0eff8; --muted: #7a798f;
    --font-display: 'Syne', sans-serif; --font-body: 'DM Sans', sans-serif;
  }
  body { font-family: var(--font-body); background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* HEADER */
  header { display: flex; align-items: center; justify-content: space-between; padding: 0 28px; height: 60px; border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0; }
  .logo { font-family: var(--font-display); font-size: 20px; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(135deg, #a78bfa, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .current-ai-badge { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); font-weight: 500; }
  .current-ai-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 8px #4ade8088; }

  /* LAYOUT */
  .main { display: flex; flex: 1; overflow: hidden; }

  /* SIDEBAR */
  .sidebar { width: 340px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; padding: 20px 16px; gap: 6px; }
  .sidebar-title { font-family: var(--font-display); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); padding: 0 8px 12px; }
  .ai-card { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; border: 1px solid transparent; cursor: pointer; transition: all 0.2s; position: relative; background: transparent; width: 100%; text-align: left; color: var(--text); }
  .ai-card:hover { background: var(--surface2); border-color: var(--border); }
  .ai-card.active { background: var(--surface2); border-color: var(--border-hover); }
  .ai-card.active::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 20px; border-radius: 0 3px 3px 0; background: var(--accent); }
  .ai-card.no-key { opacity: 0.45; }
  .ai-card.no-key:hover { opacity: 0.65; }
  .ai-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; font-weight: 700; }
  .ai-info { flex: 1; min-width: 0; }
  .ai-name { font-family: var(--font-display); font-size: 14px; font-weight: 600; white-space: normal; overflow: visible; line-height: 1.3; }
  .ai-desc { font-size: 11px; color: var(--muted); white-space: normal; line-height: 1.4; margin-top: 2px; }
  .free-badge { font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 999px; background: rgba(74,222,128,0.12); color: #4ade80; border: 1px solid rgba(74,222,128,0.25); letter-spacing: 0.5px; text-transform: uppercase; flex-shrink: 0; }
  .no-key-badge { font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 999px; background: rgba(248,113,113,0.12); color: #f87171; border: 1px solid rgba(248,113,113,0.25); letter-spacing: 0.5px; text-transform: uppercase; flex-shrink: 0; }

  /* LOCK SCREEN */
  #lock-screen { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; }
  .lock-box { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 320px; }
  .lock-logo { font-family: var(--font-display); font-size: 28px; font-weight: 800; background: linear-gradient(135deg, #a78bfa, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 4px; }
  .lock-icon { font-size: 40px; }
  .lock-subtitle { font-size: 13px; color: var(--muted); text-align: center; }
  .lock-input-wrap { width: 100%; position: relative; }
  .lock-input-wrap input { width: 100%; padding: 12px 44px 12px 16px; border-radius: 12px; border: 1px solid var(--border-hover); background: var(--surface); color: var(--text); font-family: var(--font-body); font-size: 15px; outline: none; text-align: center; letter-spacing: 4px; transition: border-color 0.2s; }
  .lock-input-wrap input:focus { border-color: rgba(168,139,250,0.5); }
  .lock-input-wrap input.error { border-color: rgba(248,113,113,0.6); animation: shake 0.35s ease; }
  .lock-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 0; line-height: 1; }
  .lock-toggle:hover { color: var(--text); }
  .btn-unlock { width: 100%; padding: 12px; border-radius: 12px; border: none; background: rgba(168,139,250,0.2); color: #a78bfa; font-family: var(--font-display); font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .btn-unlock:hover { background: rgba(168,139,250,0.35); }
  .lock-error { font-size: 12px; color: #f87171; height: 16px; text-align: center; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)} }

  /* CHAT AREA */
  .chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
  .key-warning { margin: 16px 24px 0; padding: 14px 18px; background: rgba(248,113,113,0.07); border: 1px solid rgba(248,113,113,0.2); border-radius: 12px; font-size: 13px; line-height: 1.7; color: var(--muted); }
  .key-warning strong { color: #f87171; }
  .key-warning code { background: rgba(255,255,255,0.07); padding: 1px 6px; border-radius: 4px; font-family: monospace; font-size: 12px; color: #fbbf24; }
  .key-warning a { color: #a78bfa; text-decoration: none; }
  .key-warning a:hover { text-decoration: underline; }
  .key-ok { margin: 12px 24px 0; padding: 10px 16px; background: rgba(74,222,128,0.06); border: 1px solid rgba(74,222,128,0.15); border-radius: 10px; font-size: 12px; color: #4ade80; display: flex; align-items: center; gap: 8px; }

  /* MESSAGES */
  .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 999px; }
  .welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; gap: 12px; padding: 60px 20px; text-align: center; color: var(--muted); }
  .welcome-icon { font-size: 48px; margin-bottom: 8px; }
  .welcome h2 { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--text); }
  .welcome p { font-size: 14px; max-width: 380px; line-height: 1.6; }
  .welcome code { background: rgba(255,255,255,0.07); padding: 2px 8px; border-radius: 4px; font-family: monospace; font-size: 13px; color: #fbbf24; }
  .message { display: flex; gap: 12px; max-width: 820px; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .message.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-avatar { width: 32px; height: 32px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; font-weight: 700; margin-top: 2px; }
  .message.user .msg-avatar { background: rgba(96,165,250,0.2); color: #60a5fa; }
  .msg-bubble { padding: 12px 16px; border-radius: 14px; font-size: 14px; line-height: 1.65; max-width: 680px; }
  .message.user .msg-bubble { background: rgba(96,165,250,0.12); border: 1px solid rgba(96,165,250,0.18); border-top-right-radius: 4px; color: var(--text); }
  .message.ai .msg-bubble { background: var(--surface); border: 1px solid var(--border); border-top-left-radius: 4px; color: var(--text); }
  .msg-bubble p { margin-bottom: 8px; }
  .msg-bubble p:last-child { margin-bottom: 0; }
  .msg-bubble code { background: rgba(255,255,255,0.08); padding: 2px 6px; border-radius: 4px; font-size: 12px; font-family: monospace; }
  .msg-bubble pre { background: rgba(0,0,0,0.3); padding: 0; border-radius: 8px; overflow: hidden; margin: 8px 0; font-size: 12px; font-family: monospace; line-height: 1.5; border: 1px solid var(--border-hover); }
  .msg-bubble pre code { background: none; padding: 12px 14px; display: block; overflow-x: auto; }

  /* CODE WRAP */
  .code-wrap { border-radius: 8px; overflow: hidden; margin: 8px 0; border: 1px solid var(--border-hover); }
  .code-wrap pre { border: none; border-radius: 0; margin: 0; }

  /* CODE BLOCK HEADER */
  .code-header { display: flex; align-items: center; justify-content: space-between; padding: 7px 12px; background: rgba(255,255,255,0.04); border-bottom: 1px solid var(--border); }
  .code-lang { font-size: 11px; font-family: monospace; color: var(--muted); text-transform: lowercase; letter-spacing: 0.3px; }
  .code-actions { display: flex; gap: 4px; }
  .btn-code-action { display: flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 11px; font-family: var(--font-body); cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .btn-code-action:hover { background: var(--surface2); color: var(--text); border-color: var(--border-hover); }
  .btn-code-action.copied { color: #4ade80; border-color: rgba(74,222,128,0.3); background: rgba(74,222,128,0.08); }
  .btn-code-action.dl { color: #a78bfa; border-color: rgba(168,139,250,0.3); }
  .btn-code-action.dl:hover { background: rgba(168,139,250,0.12); color: #c4b5fd; }

  /* IMAGE in bubble */
  .msg-bubble img.attached-img { max-width: 280px; max-height: 200px; border-radius: 8px; display: block; margin-bottom: 8px; object-fit: cover; border: 1px solid var(--border-hover); }

  /* PDF badge in bubble */
  .pdf-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; background: rgba(168,139,250,0.12); border: 1px solid rgba(168,139,250,0.25); border-radius: 8px; font-size: 12px; color: #a78bfa; margin-bottom: 8px; }

  /* TYPING */
  .typing-indicator { display: flex; gap: 4px; align-items: center; padding: 14px 16px; }
  .typing-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s infinite; }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }

  /* FILE PREVIEW AREA */
  .file-preview-bar { display: none; align-items: center; gap: 10px; padding: 10px 16px; background: var(--surface2); border-top: 1px solid var(--border); flex-wrap: wrap; }
  .file-preview-bar.visible { display: flex; }
  .file-chip { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--surface); border: 1px solid var(--border-hover); border-radius: 8px; font-size: 12px; color: var(--text); max-width: 240px; }
  .file-chip img { width: 32px; height: 32px; border-radius: 4px; object-fit: cover; flex-shrink: 0; }
  .file-chip-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-chip-icon { font-size: 20px; flex-shrink: 0; }
  .file-chip-remove { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 0 2px; line-height: 1; flex-shrink: 0; }
  .file-chip-remove:hover { color: #f87171; }
  .file-no-support { font-size: 11px; color: #fbbf24; padding: 4px 0; }

  /* INPUT AREA */
  .input-area { padding: 12px 24px 18px; border-top: 1px solid var(--border); background: var(--surface); flex-shrink: 0; }
  .input-row { display: flex; gap: 10px; align-items: flex-end; background: var(--surface2); border: 1px solid var(--border-hover); border-radius: 14px; padding: 10px 14px; transition: border-color 0.2s; }
  .input-row:focus-within { border-color: rgba(168,139,250,0.4); }
  #chat-input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-family: var(--font-body); font-size: 14px; resize: none; line-height: 1.5; max-height: 160px; min-height: 24px; overflow-y: auto; }
  #chat-input::placeholder { color: var(--muted); }

  .btn-attach { width: 36px; height: 36px; border-radius: 9px; border: none; background: transparent; color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; font-size: 18px; position: relative; }
  .btn-attach:hover { background: var(--surface); color: var(--text); }
  .btn-attach.has-file { color: #a78bfa; }
  .btn-attach input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }

  .btn-send { width: 36px; height: 36px; border-radius: 9px; border: none; background: rgba(168,139,250,0.2); color: #a78bfa; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; font-size: 16px; }
  .btn-send:hover { background: rgba(168,139,250,0.35); transform: scale(1.05); }
  .btn-send:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

  .input-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; padding: 0 4px; font-size: 11px; color: var(--muted); }
  .btn-clear { background: none; border: none; color: var(--muted); font-size: 11px; cursor: pointer; padding: 2px 0; font-family: var(--font-body); transition: color 0.2s; }
  .btn-clear:hover { color: #f87171; }

  /* DRAG OVER */
  .chat-area.dragover { outline: 2px dashed rgba(168,139,250,0.5); outline-offset: -8px; }

  .sidebar::-webkit-scrollbar { width: 3px; }
  .sidebar::-webkit-scrollbar-track { background: transparent; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }

  /* TOGGLE SIDEBAR */
  .btn-toggle-sidebar { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: all 0.2s; flex-shrink: 0; }
  .btn-toggle-sidebar:hover { background: var(--surface2); color: var(--text); border-color: var(--border-hover); }

  .sidebar { transition: width 0.25s ease, padding 0.25s ease; overflow: hidden; }
  .sidebar.collapsed { width: 0 !important; padding: 0 !important; border-right: none !important; }

  /* OVERLAY mobile */
  #sidebar-overlay { display: none; position: fixed; inset: 0; z-index: 99; background: rgba(0,0,0,0.55); }
  #sidebar-overlay.visible { display: block; }

  @media (max-width: 768px) {
    .sidebar { position: fixed; left: 0; top: 60px; bottom: 0; z-index: 100; width: 300px; }
    .sidebar.collapsed { width: 0 !important; }
    .ai-desc { display: none; }
  }
</style>
</head>

</div>

let pendingFile = null; // { file, base64, mimeType, isImage, isPDF }

// ─── RENDER SIDEBAR ───────────────────────────────────────────
const sidebar = document.getElementById("sidebar");
AIS.forEach(ai => {
  const hasKey = !!getKey(ai.keyName);

// ─── SELECT AI ────────────────────────────────────────────────
function selectAI(ai) {
  selectedAI = ai;
  if (!conversations[ai.id]) conversations[ai.id] = [];
  document.querySelectorAll(".ai-card").forEach(c => c.classList.remove("active"));
  document.querySelector(`[data-id="${ai.id}"]`).classList.add("active");
  document.getElementById("current-ai-name").textContent = ai.name + " · " + ai.provider;
  document.getElementById("model-info").textContent = "Modelo: " + ai.model;
  const hasKey = !!getKey(ai.keyName);
  document.getElementById("btn-send").disabled = !hasKey;
  renderStatusBar(ai, hasKey);
  renderMessages(ai);
  updateAttachBtn(ai);
  clearPendingFile();
  if (hasKey) document.getElementById("chat-input").focus();
}

function updateAttachBtn(ai) {
  const btn = document.getElementById("btn-attach");
  btn.style.opacity = ai.supportsFiles ? "1" : "0.3";
  btn.title = ai.supportsFiles
    ? (ai.supportsPDF ? "Anexar imagem ou PDF" : "Anexar imagem")
    : "Este modelo não suporta arquivos";
  const fi = document.getElementById("file-input");
  fi.accept = ai.supportsFiles
    ? (ai.supportsPDF ? "image/*,.pdf" : "image/*")
    : "";
  fi.disabled = !ai.supportsFiles;
}

// ─── STATUS BAR ───────────────────────────────────────────────
function renderStatusBar(ai, hasKey) {
  const fileInfo = ai.supportsFiles
    ? ` &bull; Suporte a arquivos: imagens${ai.supportsPDF ? " + PDF" : ""}`
    : " &bull; Somente texto";
  document.getElementById("status-bar").innerHTML = hasKey
    ? `<div class="key-ok">&#10004; Chave configurada &mdash; ${ai.freeNote}${fileInfo}</div>`
    : `<div class="key-warning"><strong>Chave de API n&atilde;o configurada</strong><br>Abra o arquivo <code>config.js</code> e preencha o campo <code>${ai.keyName}</code>.<br><a href="${ai.keyUrl}" target="_blank">&rarr; Obter chave gratuita</a></div>`;
}

// ─── RENDER MESSAGES ─────────────────────────────────────────
function renderMessages(ai) {
  const container = document.getElementById("messages");
  const conv = conversations[ai.id];
  if (!conv || conv.length === 0) {
    container.innerHTML = `<div class="welcome" id="welcome"><div class="welcome-icon" style="color:${ai.color};">${ai.emoji}</div><h2>Converse com ${ai.name}</h2><p style="color:var(--muted);font-size:14px;">${ai.freeNote}</p></div>`;
    return;
  }
  container.innerHTML = "";
  conv.forEach(msg => container.appendChild(createBubble(msg.role, msg.content, msg.filePreview, msg.fileName, msg.isPDF, ai)));
  container.scrollTop = container.scrollHeight;
}

function createBubble(role, content, filePreview, fileName, isPDF, ai) {
  const div = document.createElement("div");
  div.className = "message " + (role === "user" ? "user" : "ai");
  const avatar = document.createElement("div");
  avatar.className = "msg-avatar";
  if (role === "user") { avatar.textContent = "Eu"; avatar.style.fontSize = "10px"; avatar.style.fontWeight = "700"; }
  else { avatar.textContent = ai ? ai.emoji : "AI"; avatar.style.background = ai ? ai.bg : "var(--surface2)"; avatar.style.color = ai ? ai.color : "var(--muted)"; }
  const bubble = document.createElement("div");
  bubble.className = "msg-bubble";
  // File attachment preview inside bubble
  if (filePreview && !isPDF) {
    const img = document.createElement("img");
    img.className = "attached-img";
    img.src = filePreview;
    img.alt = fileName || "imagem";
    bubble.appendChild(img);
  } else if (isPDF && fileName) {
    const badge = document.createElement("div");
    badge.className = "pdf-badge";
    badge.innerHTML = `📄 ${escHtml(fileName)}`;
    bubble.appendChild(badge);
  }
  if (content) {
    const textDiv = document.createElement("div");
    textDiv.innerHTML = formatText(content);
    bubble.appendChild(textDiv);
  }
  div.appendChild(avatar); div.appendChild(bubble);
  return div;
}

// Map language → file extension
const LANG_EXT = {
  python:"py", py:"py", javascript:"js", js:"js", typescript:"ts", ts:"ts",
  html:"html", css:"css", json:"json", xml:"xml", yaml:"yaml", yml:"yml",
  bash:"sh", sh:"sh", shell:"sh", sql:"sql", java:"java", c:"c", cpp:"cpp",
  "c++":"cpp", cs:"cs", csharp:"cs", go:"go", rust:"rs", php:"php",
  ruby:"rb", rb:"rb", swift:"swift", kotlin:"kt", r:"r", matlab:"m",
  markdown:"md", md:"md", csv:"csv", txt:"txt", toml:"toml", ini:"ini"
};

let codeBlockCounter = 0;

function formatText(text) {
  // Code blocks with language tag: ```lang\ncode```
  text = text.replace(/```([a-zA-Z0-9_+-]*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    lang = lang.trim().toLowerCase();
    const ext = LANG_EXT[lang] || (lang || "txt");
    const displayLang = lang || "código";
    const id = "cb" + (++codeBlockCounter);
    const safeCode = escHtml(code.trim());
    // Store raw code in a data attribute for download/copy
    const dataCode = encodeURIComponent(code.trim());
    return `<div class="code-wrap" data-code="${dataCode}" data-ext="${ext}" data-id="${id}">
<div class="code-header">
  <span class="code-lang">${escHtml(displayLang)}</span>
  <div class="code-actions">
    <button class="btn-code-action" onclick="copyCode('${id}')" id="copy-${id}">⎘ Copiar</button>
    <button class="btn-code-action dl" onclick="downloadCode('${id}')">⬇ Baixar .${ext}</button>
  </div>
</div>
<pre><code>${safeCode}</code></pre>
</div>`;
  });

  // Inline code
  text = text.replace(/`([^`]+)`/g, (_, c) => `<code>${escHtml(c)}</code>`);
  // Bold / italic
  text = text.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
  text = text.replace(/\*(.*?)\*/g, "<em>$1</em>");
  // Headings
  text = text.replace(/^### (.*)/gm, "<h3 style='font-size:15px;font-weight:600;margin:10px 0 4px'>$1</h3>");
  text = text.replace(/^## (.*)/gm, "<h2 style='font-size:16px;font-weight:600;margin:10px 0 4px'>$1</h2>");
  // Paragraphs
  text = text.replace(/\n\n/g, "</p><p>").replace(/\n/g, "<br>").replace(/^(.+)/, "<p>$1</p>");
  return text;
}

function escHtml(t) { return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function getCodeData(id) {
  const wrap = document.querySelector(`[data-id="${id}"]`);
  if (!wrap) return null;
  return { code: decodeURIComponent(wrap.dataset.code), ext: wrap.dataset.ext };
}

function copyCode(id) {
  const d = getCodeData(id);
  if (!d) return;
  navigator.clipboard.writeText(d.code).then(() => {
    const btn = document.getElementById("copy-" + id);
    if (!btn) return;
    btn.textContent = "✔ Copiado!";
    btn.classList.add("copied");
    setTimeout(() => { btn.textContent = "⎘ Copiar"; btn.classList.remove("copied"); }, 2000);
  }).catch(() => {
    // fallback
    const ta = document.createElement("textarea");
    ta.value = d.code; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
    const btn = document.getElementById("copy-" + id);
    if (btn) { btn.textContent = "✔ Copiado!"; btn.classList.add("copied"); setTimeout(() => { btn.textContent = "⎘ Copiar"; btn.classList.remove("copied"); }, 2000); }
  });
}

function downloadCode(id) {
  const d = getCodeData(id);
  if (!d) return;
  const blob = new Blob([d.code], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "arquivo." + d.ext;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ─── TYPING INDICATOR ────────────────────────────────────────
function addTyping() {
  const c = document.getElementById("messages");
  const div = document.createElement("div"); div.className = "message ai"; div.id = "typing";
  const av = document.createElement("div"); av.className = "msg-avatar"; av.textContent = selectedAI.emoji; av.style.background = selectedAI.bg; av.style.color = selectedAI.color;
  const b = document.createElement("div"); b.className = "msg-bubble"; b.innerHTML = `<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
  div.appendChild(av); div.appendChild(b); c.appendChild(div); c.scrollTop = c.scrollHeight;
}
function removeTyping() { const t = document.getElementById("typing"); if (t) t.remove(); }

// ─── FILE HANDLING ────────────────────────────────────────────
function readFileAsBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(",")[1]);
    r.onerror = () => rej(new Error("Falha ao ler arquivo"));
    r.readAsDataURL(file);
  });
}

function readFileAsDataURL(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej();
    r.readAsDataURL(file);
  });
}

async function handleFileSelected(file) {
  if (!selectedAI) return;
  if (!selectedAI.supportsFiles) {
    showFileNoSupport("Este modelo não suporta arquivos.");
    return;
  }
  const isPDF = file.type === "application/pdf";
  const isImage = file.type.startsWith("image/");

  if (isPDF && !selectedAI.supportsPDF) {
    showFileNoSupport("Este modelo não suporta PDF. Apenas imagens.");
    return;
  }
  if (!isPDF && !isImage) {
    showFileNoSupport("Formato não suportado. Use imagens ou PDF.");
    return;
  }
  if (isImage && !selectedAI.supportsImageTypes.includes(file.type)) {
    showFileNoSupport("Formato de imagem não suportado para este modelo.");
    return;
  }

  const base64 = await readFileAsBase64(file);
  let previewURL = null;
  if (isImage) previewURL = await readFileAsDataURL(file);

  pendingFile = { file, base64, mimeType: file.type, isImage, isPDF, previewURL, name: file.name };
  showFileChip(pendingFile);
  document.getElementById("btn-attach").classList.add("has-file");
}

function showFileChip(pf) {
  const bar = document.getElementById("file-preview-bar");
  bar.classList.add("visible");
  document.getElementById("chip-name").textContent = pf.name;
  document.getElementById("file-no-support").style.display = "none";
  const thumb = document.getElementById("chip-thumb");
  const icon = document.getElementById("chip-icon");
  if (pf.isImage && pf.previewURL) {
    thumb.src = pf.previewURL; thumb.style.display = "block"; icon.style.display = "none";
  } else {
    thumb.style.display = "none"; icon.style.display = "inline"; icon.textContent = "📄";
  }
}

function showFileNoSupport(msg) {
  const bar = document.getElementById("file-preview-bar");
  bar.classList.add("visible");
  document.getElementById("file-chip").style.display = "none";
  const ns = document.getElementById("file-no-support");
  ns.textContent = "⚠ " + msg;
  ns.style.display = "inline";
  setTimeout(() => clearPendingFile(), 3000);
}

function clearPendingFile() {
  pendingFile = null;
  document.getElementById("file-preview-bar").classList.remove("visible");
  document.getElementById("file-chip").style.display = "flex";
  document.getElementById("file-no-support").style.display = "none";
  document.getElementById("btn-attach").classList.remove("has-file");
  document.getElementById("file-input").value = "";
}

document.getElementById("file-input").addEventListener("change", async e => {
  const file = e.target.files[0];
  if (file) await handleFileSelected(file);
});

document.getElementById("btn-remove-file").addEventListener("click", clearPendingFile);

// Drag & drop
const chatArea = document.getElementById("chat-area");
chatArea.addEventListener("dragover", e => { e.preventDefault(); chatArea.classList.add("dragover"); });
chatArea.addEventListener("dragleave", () => chatArea.classList.remove("dragover"));
chatArea.addEventListener("drop", async e => {
  e.preventDefault(); chatArea.classList.remove("dragover");
  const file = e.dataTransfer.files[0];
  if (file) await handleFileSelected(file);
});

// ─── SEND MESSAGE ─────────────────────────────────────────────
async function sendMessage() {
  const input = document.getElementById("chat-input");
  const text = input.value.trim();
  if ((!text && !pendingFile) || !selectedAI || isLoading) return;
  const key = getKey(selectedAI.keyName);
  if (!key) { alert("Configure a chave de API no arquivo config.js antes de enviar."); return; }

  isLoading = true;
  document.getElementById("btn-send").disabled = true;
  input.value = ""; input.style.height = "auto";

  const ai = selectedAI;
  if (!conversations[ai.id]) conversations[ai.id] = [];

  const fileSnap = pendingFile ? { ...pendingFile } : null;
  clearPendingFile();

  // Save to conversation history
  conversations[ai.id].push({
    role: "user", content: text,
    fileBase64: fileSnap?.base64,
    fileMime: fileSnap?.mimeType,
    filePreview: fileSnap?.previewURL,
    fileName: fileSnap?.name,
    isPDF: fileSnap?.isPDF
  });

  const container = document.getElementById("messages");
  const welcome = document.getElementById("welcome"); if (welcome) welcome.remove();
  container.appendChild(createBubble("user", text, fileSnap?.previewURL, fileSnap?.name, fileSnap?.isPDF, ai));
  addTyping(); container.scrollTop = container.scrollHeight;

  try {
    const reply = await ai.send(ai, conversations[ai.id], key);
    conversations[ai.id].push({ role: "assistant", content: reply });
    removeTyping();
    container.appendChild(createBubble("assistant", reply, null, null, false, ai));
  } catch(e) {
    removeTyping();
    container.appendChild(createBubble("assistant", "Erro: " + (e.message || "Verifique o config.js."), null, null, false, ai));
  }
  container.scrollTop = container.scrollHeight;
  isLoading = false;
  document.getElementById("btn-send").disabled = false;
  input.focus();
}

// ─── GROQ API ────────────────────────────────────────────────
async function sendGroq(ai, history, key) {
  const messages = [{ role: "system", content: SYSTEM_PT }];
  history.forEach(m => {
    const role = m.role === "assistant" ? "assistant" : "user";
    if (m.fileBase64 && m.fileMime && m.fileMime.startsWith("image/")) {
      const content = [];
      if (m.content) content.push({ type: "text", text: m.content });
      content.push({ type: "image_url", image_url: { url: `data:${m.fileMime};base64,${m.fileBase64}` } });
      messages.push({ role, content });
    } else {
      messages.push({ role, content: m.content || "" });
    }
  });
  const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
    body:JSON.stringify({model:ai.model, messages, max_tokens:2048})
  });
  if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e?.error?.message || "Erro Groq "+res.status); }
  const data = await res.json();
  return data.choices?.[0]?.message?.content || "(sem resposta)";
}

// ─── OPENROUTER API ───────────────────────────────────────────
async function sendOpenRouter(ai, history, key) {
  const messages = [{ role: "system", content: SYSTEM_PT }];
  history.forEach(m => {
    const role = m.role === "assistant" ? "assistant" : "user";
    if (m.fileBase64 && m.fileMime && m.fileMime.startsWith("image/")) {
      const content = [];
      if (m.content) content.push({ type: "text", text: m.content });
      content.push({ type: "image_url", image_url: { url: `data:${m.fileMime};base64,${m.fileBase64}` } });
      messages.push({ role, content });
    } else {
      messages.push({ role, content: m.content || "" });
    }
  });
  const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+key,"HTTP-Referer":"https://lorraneai.app","X-Title":"Lorrane IA"},
    body:JSON.stringify({model:ai.model, messages, max_tokens:2048})
  });
  if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e?.error?.message || "Erro OpenRouter "+res.status); }
  const data = await res.json();
  return data.choices?.[0]?.message?.content || "(sem resposta)";
}

// ─── INPUT EVENTS ─────────────────────────────────────────────
const input = document.getElementById("chat-input");
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; });
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
document.getElementById("btn-send").addEventListener("click", sendMessage);
document.getElementById("btn-clear").addEventListener("click", () => {
  if (!selectedAI) return;
  conversations[selectedAI.id] = [];
  renderMessages(selectedAI);
});

// Paste de imagem
document.addEventListener("paste", async e => {
  if (!selectedAI || !selectedAI.supportsFiles) return;
  const items = e.clipboardData?.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith("image/")) {
      const file = item.getAsFile();
      if (file) { await handleFileSelected(file); break; }
    }
  }
});


// ─── TOGGLE SIDEBAR ──────────────────────────────────────────
(function() {
  var btn     = document.getElementById('btn-toggle-sidebar');
  var sidebar = document.getElementById('sidebar');
  var overlay = document.getElementById('sidebar-overlay');

  function isMobile() { return window.innerWidth <= 768; }
  // Começa aberta sempre

  btn.addEventListener('click', function() {
    var fechada = sidebar.classList.contains('collapsed');
    if (fechada) {
      sidebar.classList.remove('collapsed');
      btn.textContent = '✕';
      if (isMobile()) overlay.classList.add('visible');
    } else {
      sidebar.classList.add('collapsed');
      btn.textContent = '☰';
      overlay.classList.remove('visible');
    }
  });

  overlay.addEventListener('click', function() {
    sidebar.classList.add('collapsed');
    overlay.classList.remove('visible');
    btn.textContent = '☰';
  });

  // Fechar ao clicar em IA apenas no celular
  sidebar.addEventListener('click', function(e) {
    if (e.target.closest('.ai-card') && isMobile()) {
      setTimeout(function() {
        sidebar.classList.add('collapsed');
        overlay.classList.remove('visible');
        btn.textContent = '☰';
      }, 200);
    }
  });
})();

(function() {
  var lockScreen = document.getElementById("lock-screen");
  var lockInput  = document.getElementById("lock-input");
  var lockError  = document.getElementById("lock-error");
  var btnUnlock  = document.getElementById("btn-unlock");
  var lockToggle = document.getElementById("lock-toggle");

  if (sessionStorage.getItem("lorrane_unlocked") === "1") {
    lockScreen.style.display = "none";
    return;
  }

  document.getElementById("chat-input").disabled = true;

  function tryUnlock() {
    var senha = "";
    try { senha = window.CONFIG && window.CONFIG.SENHA ? window.CONFIG.SENHA : ""; } catch(e) {}

    if (!senha) {
      lockScreen.style.display = "none";
      document.getElementById("chat-input").disabled = false;
      return;
    }

    if (lockInput.value.trim() === senha) {
      sessionStorage.setItem("lorrane_unlocked", "1");
      lockScreen.style.opacity = "0";
      lockScreen.style.transition = "opacity 0.3s ease";
      setTimeout(function() { lockScreen.style.display = "none"; }, 300);
      document.getElementById("chat-input").disabled = false;
    } else {
      lockError.textContent = "Senha incorreta. Tente novamente.";
      lockInput.classList.add("error");
      lockInput.value = "";
      setTimeout(function() {
        lockInput.classList.remove("error");
        lockError.textContent = "";
      }, 1500);
      lockInput.focus();
    }
  }

  btnUnlock.addEventListener("click", tryUnlock);
  lockInput.addEventListener("keydown", function(e) {
    if (e.key === "Enter") tryUnlock();
  });
  lockToggle.addEventListener("click", function() {
    var isPass = lockInput.type === "password";
    lockInput.type = isPass ? "text" : "password";
    lockToggle.textContent = isPass ? "🙈" : "👁";
  });

  lockInput.focus();
})();
